services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wd-inference-gateway
    ports:
      - "8081:8081"
    env_file:
      - config/gateway.env
    environment:
      SGLANG_URL: ${SGLANG_URL:-http://host.docker.internal:30000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
